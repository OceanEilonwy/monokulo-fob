<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fob for Mac · Settings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fob.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#151412}a{color:#FF8F45}a:hover{color:#FFB27F}
.ptab{width:74px;height:52px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);background:none;border:0}
.ptab.on{background:var(--sunken);color:var(--orange-text)}
.frow{display:grid;grid-template-columns:200px minmax(0,1fr);column-gap:14px;align-items:start;font-size:13px}
.frow > .lbl{text-align:right;padding-top:5px}
.popup{height:24px;border-radius:6px;background:var(--sunken);box-shadow:inset 0 0 0 1px #2A2723;display:inline-flex;align-items:center;gap:20px;padding:0 6px 0 10px;font-size:13px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;background:none;border:0;color:var(--ink);padding:0}
.swatch span.box{width:68px;height:46px;border-radius:7px;box-shadow:0 0 0 1px #2A2723;overflow:hidden;display:block}
.swatch.on span.box{box-shadow:0 0 0 2px #000,0 0 0 4px #FF6600}</style>
</helmet>
<div class="mac oled" style="width: 760px; height: 560px; flex-direction: column">
  <div style="height: 86px; display: flex; flex-direction: column; align-items: center; box-shadow: inset 0 -1px 0 #2A2723; background: #0C0B0A; position: relative">
    <div class="lights" style="position: absolute; left: 14px; top: 14px"><i></i><i></i><i></i></div>
    <div style="font-size: 13px; font-weight: 700; padding-top: 10px">General</div>
    <nav style="display: flex; gap: 4px; padding-top: 4px" aria-label="Settings sections">
      <button class="ptab on" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>General</button>
      <button class="ptab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18"></path></svg>Wallets</button>
      <button class="ptab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"></rect><rect x="3" y="13" width="18" height="7" rx="2"></rect></svg>Syncing</button>
      <button class="ptab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"></path></svg>Money</button>
      <button class="ptab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>This Mac</button>
    </nav>
  </div>

  <div style="flex: 1; padding: 28px 40px 0; display: flex; flex-direction: column; gap: 22px">
    <div class="frow">
      <span class="lbl">Appearance:</span>
      <div style="display: flex; gap: 14px">
        <button class="swatch"><span class="box" style="background: linear-gradient(90deg, #F4F1EA 50%, #000 50%)"></span>Same as Mac</button>
        <button class="swatch"><span class="box" style="background: #F4F1EA; padding: 8px; box-sizing: border-box"><span style="display: block; height: 100%; background: #fff; border-radius: 4px"></span></span>Light</button>
        <button class="swatch"><span class="box" style="background: #141311; padding: 8px; box-sizing: border-box"><span style="display: block; height: 100%; background: #1F1D1A; border-radius: 4px"></span></span>Dark</button>
        <button class="swatch on" aria-pressed="true"><span class="box" style="background: #000; padding: 8px; box-sizing: border-box"><span style="display: block; height: 100%; background: #0C0B0A; border-radius: 4px; box-shadow: inset 0 0 0 1px #2A2723"></span></span>OLED</button>
      </div>
    </div>
    <div class="frow"><span class="lbl"></span><span class="footnote muted" style="margin-top: -12px; line-height: 17px">OLED draws on true black, where an OLED or mini-LED pixel is off. Cards are held by their outlines.</span></div>

    <div class="frow"><span class="lbl">Default currency:</span><span><span class="popup">Australian dollar (AUD)<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"></path></svg></span></span></div>
    <div class="frow"><span class="lbl">Show amounts first in:</span><span style="display: flex; gap: 16px; padding-top: 4px"><label style="display: flex; gap: 6px; align-items: center"><span style="width: 14px; height: 14px; border-radius: 7px; background: #FF6600; box-shadow: inset 0 0 0 4px #FF6600, inset 0 0 0 7px #111" aria-hidden="true"></span>XMR</label><label style="display: flex; gap: 6px; align-items: center"><span style="width: 14px; height: 14px; border-radius: 7px; box-shadow: inset 0 0 0 1px #6B655A" aria-hidden="true"></span>AUD</label></span></div>

    <div class="frow"><span class="lbl">Lock when left alone:</span><span><span class="popup">After 15 minutes<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"></path></svg></span></span></div>
    <div class="frow"><span class="lbl">Unlock with:</span><span style="display: flex; flex-direction: column; gap: 6px; padding-top: 4px"><label style="display: flex; gap: 6px; align-items: center"><span style="width: 14px; height: 14px; border-radius: 3px; background: #FF6600; display: inline-flex; align-items: center; justify-content: center" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>Touch ID</label><span class="footnote muted">Your passphrase always works too.</span></span></div>
    <div class="frow"><span class="lbl"></span><span style="display: flex; gap: 8px"><button class="mac-btn">Change passphrase…</button><button class="mac-btn">Lock now</button></span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":560}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
