[package]
name = "fob-screens"
description = "What each screen shows, from the wallet's records and the clock."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
fob-codes = { path = "../fob-codes" }
fob-monero = { path = "../fob-monero" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"


[dev-dependencies]
fob-codes = { path = "../fob-codes", features = ["test-support"] }
fob-vault = { path = "../fob-vault" }
