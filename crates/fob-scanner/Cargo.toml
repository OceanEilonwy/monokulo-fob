[package]
name = "fob-scanner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Finds the blocks that may hold a wallet's money, quickly, for monero-oxide's Scanner to read."

[dependencies]
hex = "0.4"
monero-wallet = "0.2"
# The prefilter itself (decision 359). A path dependency until monokulo-8ar has a
# remote; then a git dependency pinned by rev, as orf-codec is (decision 4). The
# path is from this worktree (.claude/worktrees/light-wallet-proposal) to
# ~/Downloads/monokulo-8ar.
monokulo-8ar = { path = "../../../../../../monokulo-8ar/crates/monokulo-8ar" }

[dev-dependencies]
curve25519-dalek = { version = "4", features = ["precomputed-tables"] }
rand = "0.8"
sha3 = "0.10"
zeroize = "1"
