[package]
name = "fob-scanner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Finds the blocks that may hold a wallet's money, quickly, for monero-oxide's Scanner to read."

[dependencies]
monero-wallet = "0.2"
curve25519-dalek = { version = "4", features = ["precomputed-tables"] }
sha3 = "0.10"
subtle = "2"
zeroize = "1"
ash = { version = "0.38", default-features = false, features = ["loaded", "debug", "std"] }

[dev-dependencies]
rand = "0.8"
