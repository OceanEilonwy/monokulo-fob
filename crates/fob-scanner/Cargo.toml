[package]
name = "fob-scanner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Finds the blocks that may hold a wallet's money, quickly, for monero-oxide's Scanner to read."

[dependencies]
hex = "0.4"
monero-wallet = "0.2"
# Clearing torsion from transaction keys for a device's key images (decision 361).
curve25519-dalek = { version = "4", features = ["precomputed-tables"] }
# The prefilter itself (decisions 366, 367), pinned by rev as orf-codec is (decision 4).
monokulo-8ar = { git = "https://github.com/OceanEilonwy/monokulo-8ar", rev = "ad59eda" }

[dev-dependencies]
rand = "0.8"
sha3 = "0.10"
zeroize = "1"
