[package]
name = "fob-vault"
description = "A wallet's keys, its encrypted database and files, and the list of wallets."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
# The keys themselves, with each held on locked pages.
fob-keys = { path = "../fob-keys", features = ["mlock"] }
fob-monero = { path = "../fob-monero" }
hex = "0.4"
# Hardening the process (process.rs).
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
# The wallet's database, encrypted. OpenSSL comes from source, for every ABI
# alike, behind the `vendored-openssl` feature (decision 415).
rusqlite = { version = "0.42.0", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[features]
default = ["vendored-openssl"]
# SQLCipher's libcrypto built from source into the library (decision 415).
vendored-openssl = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
