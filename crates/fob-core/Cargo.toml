[package]
name = "fob-core"
description = "Fob: a small Monero wallet with ORF receipts. All wallet logic lives here; apps are thin wrappers."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
monero-wallet = "0.2"
monero-daemon-rpc = "0.2"
monero-epee = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2"] }
# The rustls and roots reqwest uses, to check a node's certificate in Fob
# (saying why one fails) and accept a self-signed one where asked.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1"
monero-seed = { path = "../../third_party/monero-seed" }
polyseed = { path = "../../third_party/polyseed" }
orf-codec = { git = "https://github.com/OceanEilonwy/monokular", rev = "e104a17c0f1a443d826b3d4b8efbeab705cfc39a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
curve25519-dalek = "4"
thiserror = "2"
zeroize = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
socket2 = "0.6"
chacha20poly1305 = "0.10"
qrcode = { version = "0.14", default-features = false }
percent-encoding = "2"
base64 = "0.22"
sha3 = "0.10"
unicode-normalization = "0.1.25"

[dev-dependencies]
# Reads codes back in tests: a payment code with its centre cleared must still decode.
rqrr = { version = "0.11", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["test-util"] }
zeroize = "1"
