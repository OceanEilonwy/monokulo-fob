[package]
name = "fob-words"
description = "Everything Fob says, from the typed scenarios the other crates describe."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
fob-chain = { path = "../fob-chain" }
fob-codes = { path = "../fob-codes" }
fob-monero = { path = "../fob-monero" }
fob-price = { path = "../fob-price" }
fob-scanner = { path = "../fob-scanner" }
fob-screens = { path = "../fob-screens" }
fob-vault = { path = "../fob-vault", default-features = false }
zeroize = "1"

[dev-dependencies]
fob-codes = { path = "../fob-codes", features = ["test-support"] }
serde_json = "1"
