[package]
name = "fob-wallet"
description = "Fob: a small Monero wallet with ORF receipts. The stateful wallet, over the crates beside it; apps are thin wrappers."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
monero-wallet = "0.2"
fob-chain = { path = "../fob-chain" }
fob-codes = { path = "../fob-codes" }
fob-keys = { path = "../fob-keys" }
fob-monero = { path = "../fob-monero" }
fob-price = { path = "../fob-price" }
fob-scanner = { path = "../fob-scanner" }
fob-screens = { path = "../fob-screens" }
fob-vault = { path = "../fob-vault", default-features = false }
fob-words = { path = "../fob-words" }
monero-daemon-rpc = "0.2"
monero-epee = "0.2"
orf-codec = { git = "https://github.com/OceanEilonwy/monokulo-orf", rev = "f141c91ccc0eb41a5e96c3e6df0e730e5a5d398b" }
# The wallet's database, encrypted. OpenSSL comes from source, for every ABI
# alike, behind the `vendored-openssl` feature (decision 415).
rusqlite = { version = "0.42.0", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
hex = "0.4"
curve25519-dalek = "4"
zeroize = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
sha3 = "0.10"
# A light server's commitment held to the amount, in constant time.
subtle = "2.6"
# Opens what a Trezor seals: key images and signatures (src/trezor).
chacha20poly1305 = "0.10"
# A Trezor over USB on a computer (src/trezor/usb.rs); Android talks USB itself.
# libusb is built in, so the AppImage needs nothing from the system.
rusb = { version = "0.9", features = ["vendored"], optional = true }

[features]
default = ["vendored-openssl"]
# The desktop's Trezor link over libusb.
usb = ["rusb"]
# SQLCipher's libcrypto built from source (openssl-src) into the library. An
# app that brings its own (Till vendors it in till-ffi, or uses CommonCrypto on
# Apple) turns default features off (decision 415).
vendored-openssl = ["rusqlite/bundled-sqlcipher-vendored-openssl", "fob-vault/vendored-openssl"]

[dev-dependencies]
fob-chain = { path = "../fob-chain", features = ["test-support"] }
fob-codes = { path = "../fob-codes", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
zeroize = "1"
# Random sequences of events against the coin model's invariants (wallet/coin.rs).
proptest = "1.6"
