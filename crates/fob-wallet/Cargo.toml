[package]
name = "fob-wallet"
description = "Fob: a small Monero wallet with ORF receipts. The stateful wallet, over the crates beside it; apps are thin wrappers."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
monero-wallet = "0.2"
fob-chain = { path = "../fob-chain" }
fob-codes = { path = "../fob-codes" }
fob-monero = { path = "../fob-monero" }
fob-price = { path = "../fob-price" }
fob-scanner = { path = "../fob-scanner" }
fob-screens = { path = "../fob-screens" }
fob-vault = { path = "../fob-vault" }
fob-words = { path = "../fob-words" }
monero-daemon-rpc = "0.2"
monero-epee = "0.2"
orf-codec = { git = "https://github.com/OceanEilonwy/monokular", rev = "e104a17c0f1a443d826b3d4b8efbeab705cfc39a" }
# The wallet's database, encrypted. OpenSSL comes from source, for every ABI alike.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
curve25519-dalek = "4"
zeroize = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
sha3 = "0.10"
# Opens what a Trezor seals: key images and signatures (src/trezor).
chacha20poly1305 = "0.10"

[dev-dependencies]
fob-chain = { path = "../fob-chain", features = ["test-support"] }
fob-codes = { path = "../fob-codes", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
zeroize = "1"
