[package]
name = "fob-ffi"
description = "fob-wallet for Kotlin (and later Swift), through UniFFI. Types and calls only: no wallet logic."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "fob_ffi"

# Generates the Kotlin bindings from the built library:
# cargo run -p fob-ffi --features bindgen --bin uniffi-bindgen -- generate --library …
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = ["wipe-freed"]
bindgen = ["uniffi/cli"]
# Zero every block of memory as it's freed (src/wiping.rs). Off only to
# measure what it costs: examples/wipe_bench.rs.
wipe-freed = []

[dependencies]
fob-wallet = { path = "../fob-wallet" }
# Draws other people's contact photos in memory-safe Rust, so no app hands
# their bytes to a platform C decoder (src/photo.rs).
image-webp = "0.2"
thiserror = "2"
uniffi = { version = "=0.32.2", features = ["tokio"] }
zeroize = "1"

[dev-dependencies]
curve25519-dalek = "4"
serde_json = "1"
