[package]
name = "fob-codes"
description = "Payment, wallet and profile codes, receipts, QR modules and NFC."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# A small WebP, for other crates' tests.
test-support = []

[dependencies]
base64 = "0.22"
# Connect to Fob (src/connect.rs): one-time X25519 keys, the box and its key.
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
fob-monero = { path = "../fob-monero" }
monero-wallet = "0.2"
orf-codec = { git = "https://github.com/OceanEilonwy/monokular", rev = "3823b28b20bb82faaa826c7a7432aadf7112b371" }
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
unicode-normalization = "0.1.25"
zeroize = "1"


[dev-dependencies]
hex = "0.4"
fob-vault = { path = "../fob-vault" }
# Reads codes back in tests: a payment code with its centre cleared must still decode.
rqrr = { version = "0.11", default-features = false }
