# Fob for iPhone, iPad and macOS (docs/apple/plan.md §1), generated by XcodeGen:
#   core/build-core.sh --sim (or --mac, --release) && xcodegen generate
# No .xcodeproj is committed. Owned by core; device teams request target
# changes through the coordination database (docs/apple/coordination.md).
name: Fob
options:
  bundleIdPrefix: com.monokulo.fob
  deploymentTarget:
    iOS: "26.7"
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  FobCore:
    path: core
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.22"
    CURRENT_PROJECT_VERSION: "1"
    # No team yet: CI builds the iOS targets unsigned (CODE_SIGNING_ALLOWED=NO)
    # and the macOS ones signed to run locally (ad hoc, CODE_SIGN_IDENTITY=-).
    DEVELOPMENT_TEAM: $(FOB_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  # One iOS app for iPhone and iPad: apple/ios (iPhone team), with the iPad
  # layouts in apple/ios/Pad (iPad team).
  FobiOS:
    type: application
    platform: iOS
    sources: [ios]
    dependencies:
      - package: FobCore
        product: FobCore
      - package: FobCore
        product: FobUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monokulo.fob.ios
        PRODUCT_NAME: Fob
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fob
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  # One small window, like the GTK app: apple/macos (macOS team).
  FobMac:
    type: application
    platform: macOS
    sources: [macos]
    dependencies:
      - package: FobCore
        product: FobCore
      - package: FobCore
        product: FobUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monokulo.fob.mac
        PRODUCT_NAME: Fob
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fob
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSHumanReadableCopyright: "GPL-3.0-only"
        ENABLE_HARDENED_RUNTIME: NO
  FobiPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ui-tests/iphone]
    dependencies:
      - target: FobiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monokulo.fob.uitests.iphone
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: FobiOS
  FobiPadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ui-tests/ipad]
    dependencies:
      - target: FobiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monokulo.fob.uitests.ipad
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: FobiOS
  FobMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [ui-tests/macos]
    dependencies:
      - target: FobMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monokulo.fob.uitests.mac
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FobMac
        ENABLE_HARDENED_RUNTIME: NO
  # FobCore's own unit tests (AppModel, words), on the Mac with no app:
  # they run in the macOS job, in FobMacUITests' scheme.
  FobCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [core/Tests/FobCoreTests]
    dependencies:
      - package: FobCore
        product: FobCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monokulo.fob.coretests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
# One scheme per UI-test target, so CI runs each platform alone.
schemes:
  FobiPhoneUITests:
    build:
      targets:
        FobiOS: all
        FobiPhoneUITests: [test]
    test:
      targets: [FobiPhoneUITests]
  FobiPadUITests:
    build:
      targets:
        FobiOS: all
        FobiPadUITests: [test]
    test:
      targets: [FobiPadUITests]
  FobMacUITests:
    build:
      targets:
        FobMac: all
        FobMacUITests: [test]
        FobCoreTests: [test]
    test:
      targets: [FobMacUITests, FobCoreTests]
