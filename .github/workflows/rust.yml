name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # Fob's own crates. The tests against live stagenet nodes are ignored
      # by default: CI doesn't depend on public nodes being up.
      - name: Test
        run: cargo test --locked -p fob-monero -p fob-chain -p fob-price -p fob-keys -p fob-vault -p fob-codes -p fob-screens -p fob-words -p fob-scanner -p fob-wallet -p fob-ffi -p fob-app
      - name: Clippy
        run: cargo clippy --locked -p fob-monero -p fob-chain -p fob-price -p fob-keys -p fob-vault -p fob-codes -p fob-screens -p fob-words -p fob-scanner -p fob-wallet -p fob-ffi -p fob-app --all-targets -- -D warnings

  # The desktop app, on Arch, which has the GTK and libadwaita it needs.
  gtk:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # The packages' downloads, so a run only installs them.
      - uses: actions/cache@v6
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ runner.os }}-${{ github.run_id }}
          restore-keys: pacman-${{ runner.os }}-
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git gtk4 libadwaita dbus rustup perl \
            cantarell-fonts noto-fonts adwaita-icon-theme mutter
          rustup default stable
          rustup component add clippy
      - uses: actions/checkout@v7
      # The built dependencies: a changed lockfile still starts from the last build.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gtk-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: gtk-${{ runner.os }}-
      - name: Clippy
        run: cargo clippy --locked -p fob-gtk --all-targets -- -D warnings
      - name: The layers below the app stay free of any toolkit
        run: |
          if cargo tree --locked -p fob-app -e normal --prefix none | grep -E '^(gtk4|libadwaita|glib|relm4) '; then exit 1; fi
      # GNOME's mutter, headless, drawn in software: the runner has no GPU.
      - name: Window scenes
        env:
          XDG_RUNTIME_DIR: /tmp/runtime
          GSK_RENDERER: cairo
        run: |
          mkdir -p -m 700 /tmp/runtime
          cargo build --locked -p fob-gtk
          dbus-run-session -- crates/fob-gtk/scenes.sh
